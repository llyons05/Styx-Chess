name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*', '*.*.*' ]
  pull_request:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build deps (Linux) and g++-15
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common wget ca-certificates
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 build-essential make
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-16
          sudo update-alternatives --set gcc /usr/bin/gcc-16
        shell: bash

      - name: Ensure test.sh is executable
        run: chmod +x ./test/perft.sh

      - name: Run tests
        run: |
          set -o pipefail
          ./test/perft.sh 2>&1 | tee test-output.log
        shell: bash

  build-linux:
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build deps (Linux) and g++-15
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common wget ca-certificates
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 build-essential make
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-16
          sudo update-alternatives --set gcc /usr/bin/gcc-16
        shell: bash

      - name: Set artifact version
        id: artifact_version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev-${GITHUB_SHA::7}}"
          VERSION="${VERSION//\//-}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Linux project
        run: |
          set -euo pipefail
          VERSION="${{ steps.artifact_version.outputs.version }}"
          mkdir -p "build-artifacts/${VERSION}"
          cd src
          make VERSION="${VERSION}"
          find ../engines -maxdepth 2 -type f -executable -exec cp -p {} "../build-artifacts/${VERSION}/" \;
          ls -R ../build-artifacts
        shell: bash

      - name: Upload Linux artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LukeChess-${{ steps.artifact_version.outputs.version }}-linux
          path: build-artifacts/

  build-windows:
    needs: run-tests
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            make
            git

      - name: Set artifact version
        id: artifact_version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev-${GITHUB_SHA::7}}"
          VERSION="${VERSION//\//-}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Windows project
        shell: msys2 {0}
        run: |
          set -e
          VERSION="${{ steps.artifact_version.outputs.version }}"
          mkdir -p "build-artifacts/${VERSION}"
          cd src
          
          make VERSION="${VERSION}" CXX=g++

          # Copy the .exe files created by the build
          find ../engines -maxdepth 2 -type f -iname "*.exe" -exec cp -p {} "../build-artifacts/${VERSION}/" \;

          ls -R ../build-artifacts

      - name: Upload Windows artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LukeChess-${{ steps.artifact_version.outputs.version }}-windows.exe
          path: build-artifacts/

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Set artifact version
        id: artifact_version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev-${GITHUB_SHA::7}}"
          VERSION="${VERSION//\//-}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: LukeChess-${{ steps.artifact_version.outputs.version }}-linux
          path: release-assets/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: LukeChess-${{ steps.artifact_version.outputs.version }}-windows.exe
          path: release-assets/windows

      - name: Create GitHub release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.*
          fail_on_unmatched_files: true
          generate_release_notes: true
