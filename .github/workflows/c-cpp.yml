name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*', '*.*.*' ]
  pull_request:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build deps (Linux) and g++-15
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common wget ca-certificates
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 build-essential make
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 60 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-15
          sudo update-alternatives --set gcc /usr/bin/gcc-15
        shell: bash

      - name: Ensure test.sh is executable
        run: chmod +x ./test/perft.sh

      - name: Run tests
        run: |
          set -o pipefail
          ./test/perft.sh 2>&1 | tee test-output.log
        shell: bash

      - name: Set artifact version
        id: artifact_version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev-${GITHUB_SHA::7}}"
          VERSION="${VERSION//\//-}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build project
        run: |
          set -euo pipefail
          VERSION="${{ steps.artifact_version.outputs.version }}"
          mkdir -p "build-artifacts/${VERSION}"
          cd src
          make VERSION="${VERSION}"
          find ../engines -maxdepth 2 -type f -executable -exec cp -p {} "../build-artifacts/${VERSION}/" \;
          ls -R ../build-artifacts
        shell: bash

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chess-engine-${{ steps.artifact_version.outputs.version }}
          path: build-artifacts/
